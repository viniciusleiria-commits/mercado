<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mercado</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A5E5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mercado">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: #F6F7F5; }
  @media (prefers-color-scheme: dark) { html, body { background: #111614; } }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
<script>
  window.MERCADO_CASCA = 2;
  // Esta casca pode estar guardada há dias no navegador; o que ela carrega,
  // não. O número muda a cada minuto, então os endereços mudam com ele e o
  // navegador é obrigado a buscar de novo. async=false mantém a ordem: a
  // configuração antes do app.
  (function () {
    var v = Math.floor(Date.now() / 60000);
    ["config.js", "app.js"].forEach(function (arquivo) {
      var s = document.createElement("script");
      s.src = arquivo + "?v=" + v;
      s.async = false;
      s.onerror = function () {
        document.body.innerHTML =
          '<p style="font:14px/1.5 -apple-system,sans-serif;color:#5D6B64;padding:24px;text-align:center">' +
          "Não consegui carregar o app. Veja a conexão e recarregue a página.</p>";
      };
      document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
