<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mercado de Sexta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A5E5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mercado">
<meta name="description" content="A lista de compras da casa: marcar o que está acabando durante a semana e pedir na sexta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: #F6F7F5; }
  @media (prefers-color-scheme: dark) { html, body { background: #111614; } }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<script>
  // Esta casca pode estar guardada há dias no navegador; o app, não. O número
  // muda a cada minuto, então o endereço de app.js muda com ele e o navegador
  // é obrigado a buscar de novo.
  (function () {
    var s = document.createElement("script");
    s.src = "app.js?v=" + Math.floor(Date.now() / 60000);
    s.onerror = function () {
      document.body.innerHTML =
        '<p style="font:14px/1.5 -apple-system,sans-serif;color:#5D6B64;padding:24px;text-align:center">' +
        "Não consegui carregar o app. Veja a conexão e recarregue a página.</p>";
    };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
