<!doctype html>
<html lang="pt-BR">
<head>
<title>Mercado de Sexta</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A5E5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mercado">
<meta name="description" content="A lista de compras da casa: marcar o que está acabando durante a semana e pedir na sexta.">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #2A5E5E;
    --verde-fundo: rgba(42,94,94,.09);
    --verde-fundo-fraco: rgba(42,94,94,.04);
    --horti: #3F7D52;
    --horti-fundo: rgba(63,125,82,.10);
    --mercado: #B4691F;
    --mercado-fundo: rgba(180,105,31,.10);
    --chao: #F6F7F5;
    --folha: #FFFFFF;
    --folha-2: #FBFCFB;
    --linha: #E3E7E3;
    --linha-forte: #CFD6D1;
    --tinta: #1C2320;
    --tinta-fraca: #5D6B64;
    --tinta-fraquinha: #8A968F;
    --alerta: #9B6B12;
    --alerta-fundo: rgba(155,107,18,.10);
    --sombra: 0 1px 2px rgba(28,35,32,.05);
    --raio: 12px;
    --raio-p: 8px;
    --fonte: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --verde: #7FBDB4;
      --verde-fundo: rgba(127,189,180,.12);
      --verde-fundo-fraco: rgba(127,189,180,.06);
      --horti: #83C193;
      --horti-fundo: rgba(131,193,147,.13);
      --mercado: #E0A45E;
      --mercado-fundo: rgba(224,164,94,.13);
      --chao: #111614;
      --folha: #1A211E;
      --folha-2: #1E2622;
      --linha: #2B3531;
      --linha-forte: #3C4842;
      --tinta: #E7EDE9;
      --tinta-fraca: #9BA9A1;
      --tinta-fraquinha: #74827A;
      --alerta: #E4B75F;
      --alerta-fundo: rgba(228,183,95,.13);
      --sombra: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --verde: #7FBDB4;
    --verde-fundo: rgba(127,189,180,.12);
    --verde-fundo-fraco: rgba(127,189,180,.06);
    --horti: #83C193;
    --horti-fundo: rgba(131,193,147,.13);
    --mercado: #E0A45E;
    --mercado-fundo: rgba(224,164,94,.13);
    --chao: #111614;
    --folha: #1A211E;
    --folha-2: #1E2622;
    --linha: #2B3531;
    --linha-forte: #3C4842;
    --tinta: #E7EDE9;
    --tinta-fraca: #9BA9A1;
    --tinta-fraquinha: #74827A;
    --alerta: #E4B75F;
    --alerta-fundo: rgba(228,183,95,.13);
    --sombra: 0 1px 2px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--chao);
    color: var(--tinta);
    font-family: var(--fonte);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  #app { max-width: 620px; margin: 0 auto; padding: 0 12px 92px; }
  #portao { padding-top: 18vh; }
  .portao-card { max-width: 380px; margin: 0 auto; }

  /* ---- topo ---- */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--chao);
    padding: 14px 0 10px;
    display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1px solid var(--linha);
    margin-bottom: 14px;
  }
  .top h1 { margin: 0; font-size: 17px; font-weight: 500; letter-spacing: -.2px; color: var(--verde); }
  .top .semana { font-size: 12px; color: var(--tinta-fraca); margin-left: auto; white-space: nowrap; }
  .quem {
    border: 1px solid var(--linha-forte); background: var(--folha);
    border-radius: 999px; padding: 3px 10px; font-size: 11px; color: var(--tinta-fraca);
  }

  /* ---- cartões ---- */
  .card {
    background: var(--folha); border: 1px solid var(--linha);
    border-radius: var(--raio); box-shadow: var(--sombra);
    margin-bottom: 12px; overflow: hidden;
  }
  .card > h2 {
    margin: 0; padding: 9px 14px;
    font-size: 12px; font-weight: 500; letter-spacing: .3px; text-transform: uppercase;
    color: var(--verde); background: var(--verde-fundo);
    display: flex; align-items: center; gap: 8px;
  }
  .card > h2 .cont { margin-left: auto; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--tinta-fraca); font-variant-numeric: tabular-nums; }
  .corpo { padding: 14px; }
  .corpo.sem-topo { padding-top: 12px; }

  .sub { font-size: 12px; color: var(--tinta-fraca); margin: 0 0 10px; }
  .vazio { padding: 22px 14px; text-align: center; color: var(--tinta-fraca); font-size: 13px; }

  /* ---- botões ---- */
  .btn {
    border: 1px solid var(--linha-forte); background: var(--folha);
    border-radius: var(--raio-p); padding: 9px 14px; font-size: 13px; font-weight: 500;
    color: var(--tinta); display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  }
  .btn:active { background: var(--folha-2); }
  .btn.principal { background: var(--verde); border-color: var(--verde); color: #fff; }
  :root[data-theme="dark"] .btn.principal, :root:not([data-theme="light"]) .btn.principal { color: #10201E; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn.principal { color: #fff; } }
  .btn.larga { width: 100%; }
  .btn.miuda { padding: 6px 10px; font-size: 12px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .linha-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- pílulas / chips ---- */
  .pilulas { display: flex; gap: 6px; flex-wrap: wrap; }
  .pilula {
    border: 1px solid var(--linha-forte); background: var(--folha);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--tinta-fraca);
  }
  .pilula[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; font-weight: 500; }
  :root[data-theme="dark"] .pilula[aria-pressed="true"] { color: #10201E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pilula[aria-pressed="true"] { color: #10201E; } }

  .tag { font-size: 10px; letter-spacing: .3px; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .tag.horti { background: var(--horti-fundo); color: var(--horti); }
  .tag.mercado { background: var(--mercado-fundo); color: var(--mercado); }

  /* ---- rodada: um por um ---- */
  .progresso { height: 4px; background: var(--linha); border-radius: 999px; overflow: hidden; margin: 0 0 4px; }
  .progresso i { display: block; height: 100%; background: var(--verde); border-radius: 999px; transition: width .18s ease; }
  .progresso-txt { font-size: 11px; color: var(--tinta-fraquinha); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }

  .foco { text-align: center; padding: 6px 0 2px; }
  .foco .cat { font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--tinta-fraquinha); }
  .foco .nome { font-size: 26px; font-weight: 500; letter-spacing: -.4px; margin: 4px 0 6px; text-wrap: balance; line-height: 1.2; user-select: text; -webkit-user-select: text; }
  .foco .qtd-grande { font-size: 13px; color: var(--tinta-fraca); }
  .copiado { font-size: 12px; color: var(--verde); text-align: center; margin-top: 8px; min-height: 17px; }
  .foco .dica { font-size: 12px; color: var(--tinta-fraca); min-height: 16px; }
  .foco .dica.quente { color: var(--alerta); }
  .decisao { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .decisao .btn { padding: 16px 10px; font-size: 15px; }
  .btn.sim { background: var(--verde); border-color: var(--verde); color: #fff; }
  :root[data-theme="dark"] .btn.sim { color: #10201E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.sim { color: #10201E; } }
  .btn.nao { background: var(--folha-2); }
  .pe { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .link { background: none; border: 0; color: var(--tinta-fraca); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; padding: 4px 2px; }
  .link.forte { color: var(--verde); }

  /* ---- listas de itens ---- */
  .grupo-titulo {
    font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--tinta-fraca);
    background: var(--verde-fundo-fraco); padding: 5px 14px; border-top: 1px solid var(--linha); border-bottom: 1px solid var(--linha);
  }
  .fila { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--linha); border-left: 3px solid transparent; width: 100%; text-align: left; background: none; border-top: 0; border-right: 0; }
  .fila:last-child { border-bottom: 0; }
  .fila.horti { border-left-color: var(--horti); }
  .fila.mercado { border-left-color: var(--mercado); }
  .fila .nome { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .fila .meta { font-size: 11px; color: var(--tinta-fraquinha); }
  .fila.marcado { background: var(--verde-fundo-fraco); }
  .fila.marcado .nome { font-weight: 500; }
  .fila.feito .nome { color: var(--tinta-fraquinha); text-decoration: line-through; }
  .caixa {
    width: 22px; height: 22px; flex: none; border: 1.5px solid var(--linha-forte); border-radius: 6px;
    display: grid; place-items: center; background: var(--folha);
  }
  .caixa svg { width: 13px; height: 13px; opacity: 0; }
  .fila.marcado .caixa, .fila.feito .caixa { background: var(--verde); border-color: var(--verde); }
  .fila.marcado .caixa svg, .fila.feito .caixa svg { opacity: 1; }
  .qtd { display: flex; align-items: center; gap: 6px; flex: none; }
  .qtd button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--folha); font-size: 15px; line-height: 1; display: grid; place-items: center; color: var(--tinta-fraca); }
  .qtd span { min-width: 34px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--tinta-fraca); }

  /* ---- texto para copiar ---- */
  .texto-lista {
    width: 100%; min-height: 120px; resize: vertical; margin-top: 10px;
    border: 1px solid var(--linha); border-radius: var(--raio-p); padding: 10px;
    background: var(--folha-2); color: var(--tinta); font-size: 13px; line-height: 1.6;
  }
  .aviso-copia { font-size: 11px; color: var(--tinta-fraca); margin-top: 6px; }

  /* ---- busca e campos ---- */
  .campo, .selec {
    width: 100%; border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
    padding: 9px 11px; background: var(--folha); font-size: 14px;
  }
  .rotulo { display: block; font-size: 11px; letter-spacing: .3px; text-transform: uppercase; color: var(--tinta-fraca); margin: 0 0 4px; }
  .campo-bloco { margin-bottom: 12px; }

  /* ---- abas de baixo ---- */
  .abas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--folha); border-top: 1px solid var(--linha);
    display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .abas .aba {
    flex: 1; background: none; border: 0; padding: 6px 2px; border-radius: var(--raio-p);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; color: var(--tinta-fraca);
  }
  .abas .aba svg { width: 18px; height: 18px; }
  .abas .aba[aria-current="true"] { color: var(--verde); font-weight: 500; background: var(--verde-fundo); }

  /* ---- modal ---- */
  .fundo-modal {
    position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100dvh;
    z-index: 50; background: rgba(16,22,20,.5);
    display: flex; align-items: flex-end; justify-content: center; padding: 0;
  }
  @media (min-width: 560px) { .fundo-modal { align-items: center; padding: 20px; } }
  .modal {
    background: var(--folha); width: 100%; max-width: 560px; overflow: auto;
    max-height: 86vh; max-height: 86dvh;
    border-radius: var(--raio) var(--raio) 0 0; border: 1px solid var(--linha);
  }
  /* o rodapé acompanha a rolagem: no iPhone a barra do Safari come o pé da folha */
  .acoes-fim {
    position: sticky; bottom: -1px; z-index: 2;
    background: var(--folha); border-top: 1px solid var(--linha);
    margin: 12px -14px calc(-14px + env(safe-area-inset-bottom, 0px)) -14px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 560px) { .modal { border-radius: var(--raio); } }
  .modal h3 {
    margin: 0; padding: 12px 14px; font-size: 13px; font-weight: 500; color: var(--verde);
    background: var(--verde-fundo); display: flex; align-items: center; gap: 8px;
  }
  .modal h3 .fechar { margin-left: auto; background: none; border: 0; color: var(--tinta-fraca); font-size: 20px; line-height: 1; padding: 0 4px; }
  .modal .corpo { padding: 14px; }

  .previa { border: 1px solid var(--linha); border-radius: var(--raio-p); margin: 10px 0; }
  .previa .fila { padding: 8px 10px; }

  .nota { background: var(--alerta-fundo); color: var(--alerta); border-radius: var(--raio-p); padding: 9px 11px; font-size: 12px; }
</style>

<div id="app">
  <div id="portao" hidden>
    <div class="card portao-card">
      <h2>Lista da casa</h2>
      <div class="corpo">
        <p class="sub" id="portao-texto">A mesma senha para todo mundo da casa. Se ninguém entrou ainda, a que você digitar agora vira a senha. Digita uma vez; este aparelho lembra.</p>
        <label class="rotulo" for="senha">Senha</label>
        <input class="campo" id="senha" type="password" autocomplete="current-password" enterkeyhint="go">
        <div class="linha-btns" style="margin-top:12px">
          <button class="btn principal larga" type="button" id="btn-entrar">Entrar</button>
        </div>
        <div id="portao-aviso"></div>
      </div>
    </div>
  </div>

  <header class="top">
    <h1>Mercado de Sexta</h1>
    <button class="quem" id="btn-quem" type="button">Quem sou eu</button>
    <span class="semana" id="rot-semana"></span>
  </header>

  <main>
    <section class="tela" id="tela-rodada"></section>
    <section class="tela" id="tela-listas" hidden></section>
    <section class="tela" id="tela-itens" hidden></section>
  </main>
</div>

<nav class="abas" role="tablist">
  <button class="aba" type="button" data-tela="rodada" aria-current="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4"/></svg>
    Semana
  </button>
  <button class="aba" type="button" data-tela="listas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Listas
  </button>
  <button class="aba" type="button" data-tela="itens">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18l-2 13H5L3 6z"/><path d="M8 6V4a4 4 0 018 0v2"/></svg>
    Itens
  </button>
</nav>

<div id="area-modal"></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Mercado de Sexta
     - lista/itens        : a lista mestra, um mapa id -> item
     - rodadas/atual      : a rodada da semana (o que foi perguntado)
     - historico/rodadas   : data -> ids que precisaram (para a cadência)
     Escrita sempre por chave (update com merge), nunca despejando o
     mapa inteiro por cima: o Vinicius e a esposa mexem ao mesmo tempo.
  --------------------------------------------------------------- */

  var CAMINHOS = { itens: "lista/itens", rodada: "rodadas/atual", historico: "historico/rodadas" };

  var S = {
    itens: {},
    rodada: null,
    historico: {},
    tela: "rodada",
    modo: "um",
    ordem: "lista",
    idx: 0,
    filtro: "todos",
    filtroCasa: "tudo",
    busca: "",
    quem: localStorage.getItem("mercado:quem") || "",
    travado: localStorage.getItem("mercado:travado") === "1",
    pedido: null,
    pronto: false
  };

  /* ---------------- utilidades ---------------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function normalizar(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  }
  function hoje() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dataCurta(iso) {
    if (!iso) return "";
    var p = iso.split("-");
    return p[2] + "/" + p[1];
  }
  function diasEntre(a, b) {
    return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
  }
  function novoId() {
    return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function plural(n, um, muitos) { return n + " " + (n === 1 ? um : muitos); }

  /* ---------------- guarda dos dados ---------------- */

  var Store = (function () {
    var db = null;      // banco do Artifact (dentro do Claude)
    var fb = null;      // nó da casa no Firebase (página hospedada)
    var ouvintes = {};
    var local = {};

    // O update do Firebase troca o filho inteiro quando recebe objeto aninhado.
    // Achatando até a folha, ele passa a mesclar campo a campo — que é o que o
    // app precisa: o Vinicius e a casa mexem na mesma semana ao mesmo tempo.
    function achatar(obj, prefixo, saida) {
      saida = saida || {}; prefixo = prefixo || "";
      Object.keys(obj).forEach(function (k) {
        var v = obj[k], caminho = prefixo ? prefixo + "/" + k : k;
        if (v && typeof v === "object" && !Array.isArray(v)) achatar(v, caminho, saida);
        else saida[caminho] = v;
      });
      return saida;
    }

    function chaveLocal(p) { return "mercado:" + p; }
    function lerLocal(p) {
      try { return JSON.parse(localStorage.getItem(chaveLocal(p)) || "null"); } catch (e) { return null; }
    }
    function gravarLocal(p, corpo) {
      local[p] = corpo;
      try { localStorage.setItem(chaveLocal(p), JSON.stringify(corpo)); } catch (e) {}
      if (ouvintes[p]) ouvintes[p](corpo);
    }
    function mesclar(alvo, remendo) {
      Object.keys(remendo).forEach(function (k) {
        var v = remendo[k];
        if (v && typeof v === "object" && !Array.isArray(v)) {
          alvo[k] = mesclar(Object.assign({}, alvo[k] || {}), v);
        } else { alvo[k] = v; }
      });
      return alvo;
    }

    return {
      temBanco: function () { return !!db || !!fb; },
      comoGuarda: function () { return db ? "claude" : fb ? "firebase" : "local"; },

      async abrir() {
        try {
          db = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null;
        } catch (e) { db = null; }
        return !!db;
      },

      // Página hospedada: a senha vira o nome do nó, e é só ele que as regras
      // do Firebase deixam ler. Sem a senha não há caminho para adivinhar.
      abrirFirebase(config, chave) {
        if (!window.firebase || !config || !config.databaseURL) return false;
        try {
          if (!firebase.apps.length) firebase.initializeApp(config);
          fb = firebase.database().ref("listas/" + chave);
          return true;
        } catch (e) { fb = null; return false; }
      },

    var palavras = normalizar(nome).split(/[ ,/()\-]+/).filter(Boolean);
    var seco = " " + palavras.join(" ") + " ";
    var melhor = null;

    function considerar(cat, destino, alvo) {
      if (seco.indexOf(" " + alvo + " ") < 0) return;

        melhor = { categoria: cat, destino: destino, tamanho: alvo.length };

    PALAVRAS_CAT.forEach(function (g) {
      g.p.forEach(function (alvo) { considerar(g.cat, "mercado", alvo); });
    });

    if (melhor) return { categoria: melhor.categoria, destino: melhor.destino };
    if (grupoAtual) return { categoria: grupoAtual.cat, destino: grupoAtual.destino };
    return { categoria: "Outros", destino: "mercado" };

  function analisarTexto(texto) {

        .replace(/^[\s\u2022\u25e6\u25aa\u00b7*\-\u2013\u2014+>]+/, "")
        .replace(/^\[[\sxX\u2713\u2714]?\]\s*/, "")
        .replace(/^\d+[.)]\s+/, "")
        .replace(/[\u2705\u2611\u274c\u2714\ufe0f]/g, "")

      // "Arroz 2" vira "Arroz"; "Arroz 5kg" e "Leite 1L" ficam como estão,
      // porque aí o número tem unidade colada e faz parte do nome.
      var semConta = l.replace(/\s+[-\u2013\u2014:=xX\u00d7]?\s*[([]?\s*\d+(?:[.,]\d+)?\s*[)\]]?\s*$/, "").trim();
      return semConta || l;

    var maiusculaValeCategoria = uteis.length > 0 && caixaAlta / uteis.length < 0.6;

        if (!rotulo) return;

      var palpite = adivinhar(l, grupo);

  function avisoCopia(texto) {
    var el = document.getElementById("copiado");
    if (el) el.textContent = texto;
  }

  function copiarNome(texto) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(
        function () { avisoCopia("copiado: " + texto); },
        function () { avisoCopia("não deu para copiar — segure no nome acima"); }
      );
      return;
    }
    var ta = document.createElement("textarea");
    ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    avisoCopia(ok ? "copiado: " + texto : "não deu para copiar — segure no nome acima");
  }

  function aplicarBusca(ondeId) {
    var termo = normalizar(S.busca);
    var alvo = document.getElementById(ondeId || "tela-itens");
    if (!alvo) return;
    alvo.querySelectorAll(".fila[data-busca]").forEach(function (el) {
      el.hidden = !!termo && el.getAttribute("data-busca").indexOf(termo) < 0;
    });
    alvo.querySelectorAll(".grupo-titulo").forEach(function (t) {
      var algum = false, n = t.nextElementSibling;
      while (n && n.classList.contains("fila")) { if (!n.hidden) algum = true; n = n.nextElementSibling; }
      t.hidden = !algum;
    });
  }

  function desenhar() {
    var y = window.scrollY;
    document.getElementById("rot-semana").textContent = S.pronto ? (Store.temBanco() ? "compartilhado" : "só neste aparelho") : "carregando…";
    
    var q = document.getElementById("btn-quem");
    q.textContent = S.quem === "esposa" ? "Esposa" : S.quem === "casa" ? "Casa" : S.quem === "vini" ? "Vinicius" : "Quem sou eu";
    var soCasa = S.quem === "casa";
    document.querySelector(".abas").hidden = soCasa;
    if (soCasa) S.tela = "rodada";
    ["rodada", "listas", "itens"].forEach(function (t) {
      document.getElementById("tela-" + t).hidden = S.tela !== t;
    });
    document.querySelectorAll(".abas .aba").forEach(function (b) {
      b.setAttribute("aria-current", b.getAttribute("data-tela") === S.tela ? "true" : "false");
    });
    if (soCasa) desenhaCasa();
    else if (S.tela === "rodada") desenhaRodada();
    else if (S.tela === "listas") desenhaListas();
    else desenhaItens();
    window.scrollTo(0, y);
  }

  /* ---------------- ações ---------------- */

  async function garantirRodada() {
    if (S.rodada && S.rodada.data) return;
    var nova = { data: hoje(), marcados: {}, feitos: {}, fechada: false };
    S.rodada = nova;
    await Store.gravarDoc(CAMINHOS.rodada, nova);
  }

  async function marcar(id, quer) {
    await garantirRodada();
    var m = marcado(id) || {};
    var corpo = { precisa: !!quer, qtd: m.qtd || 1, quando: hoje(), por: S.quem || "" };
    S.rodada.marcados = S.rodada.marcados || {};
    S.rodada.marcados[id] = Object.assign({}, m, corpo);
    desenhar();
    await Store.mesclarDoc(CAMINHOS.rodada, { marcados: (function (o) { o[id] = corpo; return o; })({}) });
  }

  async function mudarQtd(id, d) {
    var m = marcado(id) || { precisa: true, qtd: 1 };
    var q = Math.max(1, (m.qtd || 1) + d);
    S.rodada.marcados[id] = Object.assign({}, m, { qtd: q });
    desenhar();
    await Store.mesclarDoc(CAMINHOS.rodada, { marcados: (function (o) { o[id] = { qtd: q }; return o; })({}) });
  }

  async function alternarFeito(id) { return definirFeito(id, !feito(id)); }

  async function definirFeito(id, novo) {
    await garantirRodada();
    S.rodada.feitos = S.rodada.feitos || {};
    S.rodada.feitos[id] = novo;
    desenhar();
    await Store.mesclarDoc(CAMINHOS.rodada, { feitos: (function (o) { o[id] = novo; return o; })({}) });
  }

  async function fecharRodada() {
    await garantirRodada();
    var ids = itensArray().filter(function (it) { return precisa(it.id); }).map(function (it) { return it.id; });
    var data = S.rodada.data || hoje();
    var rodadas = Object.assign({}, S.historico.rodadas || {});
    rodadas[data] = ids;
    var chaves = Object.keys(rodadas).sort();
    while (chaves.length > 60) { delete rodadas[chaves.shift()]; }
    S.historico.rodadas = rodadas;
    S.rodada.fechada = true;
    S.tela = "listas";
    desenhar();
    await Store.mesclarDoc(CAMINHOS.historico, { rodadas: (function (o) { o[data] = ids; return o; })({}) });
    await Store.mesclarDoc(CAMINHOS.rodada, { fechada: true });
  }

  async function novaRodada() {
    if (S.rodada && decididos() && !S.rodada.fechada) {
      if (!confirm("A semana de " + dataCurta(S.rodada.data) + " ainda não virou lista. Começar uma nova mesmo assim?")) return;
    }
    var nova = { data: hoje(), marcados: {}, feitos: {}, fechada: false };
    S.rodada = nova;
    S.idx = 0;
    S.tela = "rodada";
    desenhar();
    await Store.gravarDoc(CAMINHOS.rodada, nova);
  }

  async function gravarItem(id, dados) {
    S.itens[id] = Object.assign({}, S.itens[id] || {}, dados);
    desenhar();
    await Store.mesclarDoc(CAMINHOS.itens, { itens: (function (o) { o[id] = dados; return o; })({}) });
  }

  async function excluirItem(id) {
    var doc = (await Store.lerDoc(CAMINHOS.itens)) || { itens: {} };
    var itens = Object.assign({}, doc.itens || {});
    delete itens[id];
    S.itens = itens;
    desenhar();
    await Store.gravarDoc(CAMINHOS.itens, { itens: itens });
  }

  async function adicionarVarios(lista, substituir) {
    var base = substituir ? {} : Object.assign({}, S.itens);
    var maiorOrdem = 0;
    Object.keys(base).forEach(function (k) { maiorOrdem = Math.max(maiorOrdem, base[k].ordem || 0); });
    var novos = {};
    var existentes = {};
    Object.keys(base).forEach(function (k) { existentes[normalizar(base[k].nome)] = true; });
    lista.forEach(function (it, i) {
      var chave = normalizar(it.nome);
      if (existentes[chave]) return;
      existentes[chave] = true;
      novos[novoId()] = {
        nome: it.nome, categoria: it.categoria, destino: it.destino,
        unidade: it.unidade || "", obs: it.obs || "",
        ordem: maiorOrdem + i + 1
      };
    });
    if (substituir) {
      S.itens = novos;
      await Store.gravarDoc(CAMINHOS.itens, { itens: novos });
      await novaRodada();
    } else {
      Object.assign(S.itens, novos);
      await Store.mesclarDoc(CAMINHOS.itens, { itens: novos });
    }
    S.idx = 0;
    desenhar();
    return Object.keys(novos).length;
  }

  function copiar(texto, botao) {
    function feedback(ok) {
      if (!botao) return;
      var antes = botao.textContent;
      botao.textContent = ok ? "Copiado" : "Copie do texto abaixo";
      setTimeout(function () { botao.textContent = antes; }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { feedback(true); }, function () { manual(); });
    } else { manual(); }
    function manual() {
      var ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      feedback(ok);
      if (!ok && botao) {
        var caixa = document.getElementById("txt-" + botao.getAttribute("data-valor"));
        if (caixa) caixa.hidden = false;
      }
    }
  }

  document.getElementById("app").addEventListener("click", function (ev) {
    var a = acaoDe(ev.target);
    if (!a) return;
    var arr = ordemLista();
    switch (a.acao) {
      case "modo": S.modo = a.valor; if (S.modo === "um") S.idx = Math.min(S.idx, arr.length); desenhar(); break;
      case "ordem": S.ordem = a.valor; S.idx = 0; desenhar(); break;
      case "filtro": S.filtro = a.valor; desenhar(); break;
      case "filtro-casa": S.filtroCasa = a.valor; desenhar(); break;
      case "faltou": modalFaltou(); break;
      case "decidir":
        if (arr[S.idx]) { marcar(arr[S.idx].id, a.valor === "1"); S.idx++; desenhar(); }
        break;
      case "voltar": if (S.idx > 0) { S.idx--; desenhar(); } break;
      case "pular": if (S.idx < arr.length) { S.idx++; desenhar(); } break;
      case "alternar": marcar(a.id, !precisa(a.id)); break;
      case "qtd": mudarQtd(a.id, Number(a.valor)); break;
      case "feito": alternarFeito(a.id); break;
      case "fechar": fecharRodada(); break;
      case "nova": novaRodada(); break;
      case "copiar": copiar(textoDaLista(a.valor), a.el); break;
      case "pedir": {
        var lista = daLista(a.valor);
        var i0 = 0;
        while (i0 < lista.length && feito(lista[i0].id)) i0++;
        S.pedido = { destino: a.valor, idx: Math.min(i0, lista.length) };
        S.tela = "listas";
        desenhar();
        if (lista[S.pedido.idx]) copiarNome(lista[S.pedido.idx].nome);
        break;
      }
      case "pedido-feito": {
        var lista2 = daLista(S.pedido.destino);
        var atual = lista2[S.pedido.idx];
        if (atual) definirFeito(atual.id, true);
        S.pedido.idx++;
        desenhar();
        var prox = daLista(S.pedido.destino)[S.pedido.idx];
        if (prox) copiarNome(prox.nome);
        break;
      }
      case "pedido-pular": {
        S.pedido.idx++;
        desenhar();
        var seguinte = daLista(S.pedido.destino)[S.pedido.idx];
        if (seguinte) copiarNome(seguinte.nome);
        break;
      }
      case "pedido-voltar":
        if (S.pedido.idx > 0) {
          S.pedido.idx--;
          desenhar();
          var anterior = daLista(S.pedido.destino)[S.pedido.idx];
          if (anterior) copiarNome(anterior.nome);

        break;
      case "pedido-copiar": {
        var agora = daLista(S.pedido.destino)[S.pedido.idx];
        if (agora) copiarNome(agora.nome);
        break;
      }
      case "pedido-sair": S.pedido = null; desenhar(); break;
      case "ver-texto": var c = document.getElementById("txt-" + a.valor); if (c) c.hidden = !c.hidden; break;
      case "editar": modalItem(a.id); break;

        document.querySelectorAll("#f-destino .pilula").forEach(function (p) {
          p.setAttribute("aria-pressed", p === a.el ? "true" : "false");

  /* ---------------- partida ---------------- */

  async function digerir(senha) {
    var txt = "mercado:" + String(senha || "").trim().toLowerCase();
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("");
    }
    var h = 0;
    for (var i = 0; i < txt.length; i++) { h = (h * 31 + txt.charCodeAt(i)) >>> 0; }
    return "sc" + h.toString(16);
  }

  function senhaDoEndereco() {
    var bruto = (location.hash || "").replace(/^#/, "") + "&" + (location.search || "").replace(/^\?/, "");
    var achado = /(?:^|&)casa=([^&]+)/.exec(bruto);
    if (!achado) return "";
    try { return decodeURIComponent(achado[1]); } catch (e) { return achado[1]; }
  }

  function papelDoEndereco() {
    var bruto = (location.hash || "").replace(/^#/, "") + "&" + (location.search || "").replace(/^\?/, "");
    var achado = /(?:^|&)papel=(vini|esposa|casa)(?:&|$)/.exec(bruto);
    return achado ? achado[1] : "";
  }

  function limparEndereco() {
    if (window.history && history.replaceState) {
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
    }
  }

  function mostrarPortao(cfg, senhaInicial, papelInicial) {
    var portao = document.getElementById("portao");
    var corpoApp = document.querySelector("main");
    var topo = document.querySelector(".top");
    portao.hidden = false;
    corpoApp.hidden = true;
    topo.hidden = true;
    document.querySelector(".abas").hidden = true;

    var campo = document.getElementById("senha");
    var botao = document.getElementById("btn-entrar");
    var aviso = document.getElementById("portao-aviso");
    var chavePendente = null;

    function dizer(html) { aviso.innerHTML = html; }

    async function tentar() {
      var senha = campo.value.trim();
      if (senha.length < 4) { dizer('<div class="nota" style="margin-top:12px">A senha precisa de pelo menos 4 letras.</div>'); return; }
      botao.disabled = true;
      dizer('<p class="sub" style="margin-top:12px">Conferindo…</p>');
      var chave = await digerir(senha);
      var existe = await Store.existeNoFirebase(cfg, chave);
      botao.disabled = false;
      if (existe === null) {
        dizer('<div class="nota" style="margin-top:12px">Não consegui falar com o banco de dados. Veja a conexão e tente de novo.</div>');
        return;
      }
      if (existe) { entrar(cfg, chave, false, senha, papelInicial); return; }
      chavePendente = chave;
      dizer('<p class="sub" style="margin-top:12px">Ninguém entrou com essa senha ainda. Se é a primeira vez da casa, ' +
        'crie a lista agora — esta senha passa a ser a de todo mundo. Se já existe lista, confira se digitou certo.</p>' +
        '<div class="linha-btns">' +
        '<button class="btn principal larga" type="button" id="btn-criar">Criar a lista com esta senha</button></div>');
      document.getElementById("btn-criar").addEventListener("click", function () {
        entrar(cfg, chavePendente, true, senha, papelInicial);
      });
    }

    botao.addEventListener("click", tentar);
    campo.addEventListener("keydown", function (ev) { if (ev.key === "Enter") tentar(); });

    // Link de convite: a senha vem no endereço, ninguém digita nada. Sai da
    // barra assim que é lida, para não ficar em foto de tela nem no histórico.
    if (senhaInicial) {
      campo.value = senhaInicial;
      limparEndereco();
      document.getElementById("portao-texto").textContent = "Entrando com a senha do link…";
      tentar();
      return;
    }
    setTimeout(function () { campo.focus(); }, 60);
  }

  async function entrar(cfg, chave, criar, senha, papel) {
    if (!Store.abrirFirebase(cfg, chave)) {
      document.getElementById("portao-aviso").innerHTML =
        '<div class="nota" style="margin-top:12px">Não consegui abrir o banco de dados.</div>';
      return;
    }
    try {
      localStorage.setItem("mercado:chave", chave);
      if (senha) localStorage.setItem("mercado:senha", senha);
      if (papel) {
        localStorage.setItem("mercado:quem", papel);
        localStorage.setItem("mercado:travado", "1");
        localStorage.removeItem("mercado:senha");
        S.quem = papel;
        S.travado = true;
      }
    } catch (e) {}
    if (criar) await Store.marcarCasa();
    document.getElementById("portao").hidden = true;
    document.querySelector("main").hidden = false;
    document.querySelector(".top").hidden = false;
    await comecar();
  }

  (async function iniciar() {
    var cfg = window.MERCADO_FIREBASE || null;
    var temClaude = await Store.abrir();
    if (!temClaude && cfg && cfg.databaseURL) {
      var doLink = senhaDoEndereco();
      if (doLink) { mostrarPortao(cfg, doLink, papelDoEndereco()); return; }
      var guardada = null;
      try { guardada = localStorage.getItem("mercado:chave"); } catch (e) {}
      if (guardada && Store.abrirFirebase(cfg, guardada)) { await comecar(); return; }
      mostrarPortao(cfg);
      return;
    }
    await comecar();
  })();

  async function comecar() {
    await Store.garantir(CAMINHOS.itens, { itens: {} });
    await Store.garantir(CAMINHOS.historico, { rodadas: {} });
    await Store.garantir(CAMINHOS.rodada, { data: hoje(), marcados: {}, feitos: {}, fechada: false });

    Store.escutar(CAMINHOS.itens, function (doc) {
      S.itens = (doc && doc.itens) ? doc.itens : {};
      if (S.pronto) desenhar();
    });
    Store.escutar(CAMINHOS.rodada, function (doc) {
      S.rodada = doc || { data: hoje(), marcados: {}, feitos: {}, fechada: false };
      if (S.pronto) desenhar();
    });
    Store.escutar(CAMINHOS.historico, function (doc) {
      S.historico = doc || { rodadas: {} };
      if (S.pronto) desenhar();
    });

    S.pronto = true;
    var arr = ordemLista();
    for (var i = 0; i < arr.length; i++) { if (!decidido(arr[i].id)) { S.idx = i; break; } }
    desenhar();
    if (!S.quem && !S.travado) modalQuem();
  }
})();
</script>
